[tools]
go = "1.26.1"

[env]
GOWORK = "off"
_.file = ".env"

[tasks.up]
description = "Start all infrastructure services"
run = "docker-compose up -d"

[tasks.down]
description = "Stop all infrastructure services"
run = "docker-compose down"

[tasks."db:migrate"]
description = "Apply all pending migrations"
run = [
  "./scripts/migrate.sh cashback-service up",
  "./scripts/migrate.sh blockchain-adapter up",
  "./scripts/migrate.sh mint-consumer up",
]

[tasks."wait:postgres"]
description = "Wait for PostgreSQL to accept connections"
run = """
until docker-compose exec -T postgres pg_isready -U cashback_app 2>/dev/null; do
  echo "Waiting for PostgreSQL..."
  sleep 2
done
"""

[tasks."wait:nats"]
description = "Wait for NATS to be ready"
run = """
until curl -sf http://localhost:8222/healthz >/dev/null 2>&1; do
  echo "Waiting for NATS..."
  sleep 2
done
"""

[tasks."wait:api"]
description = "Wait for cashback-service-api to be ready"
run = """
until curl -sf http://localhost:8080/health >/dev/null 2>&1; do
  echo "Waiting for API..."
  sleep 2
done
"""

[tasks."db:setup"]
description = "Apply all pending migrations (waits for PostgreSQL)"
depends = ["wait:postgres"]
run = "mise run db:migrate"

[tasks."db:reset"]
description = "Drop and recreate PostgreSQL data, then re-apply all migrations"
run = """
docker-compose stop postgres
docker-compose rm -f postgres
docker volume rm cashback-platform_postgres_data 2>/dev/null || true
docker-compose up -d postgres
mise run db:setup
"""

[tasks.deps]
description = "Tidy all modules"
run = [
  "cd services/cashback-service-api && go mod tidy",
  "cd services/mint-consumer && go mod tidy",
  "cd services/blockchain-adapter && go mod tidy",
]

[tasks."run:adapter"]
description = "Run blockchain-adapter"
depends = ["wait:postgres"]
run = "cd services/blockchain-adapter && go run ./cmd/main.go"

[tasks."run:api"]
description = "Run cashback-service-api"
depends = ["wait:postgres", "wait:nats"]
run = "cd services/cashback-service-api && go run ./cmd/api/main.go"

[tasks."run:consumer"]
description = "Run mint-consumer"
depends = ["wait:postgres", "wait:nats", "wait:api"]
run = "cd services/mint-consumer && go run ./cmd/main.go"

[tasks.dev]
description = "Fresh start: bring up infrastructure, run migrations, then start all 3 services"
depends = ["up", "db:setup"]
run = """
mise run run:adapter &
mise run run:api &
mise run run:consumer
"""

[tasks.lint]
description = "Lint all modules"
run = [
  "cd services/cashback-service-api && golangci-lint run",
  "cd services/mint-consumer && golangci-lint run",
  "cd services/blockchain-adapter && golangci-lint run",
]

[tasks.proto]
description = "Generate Go code from proto/token.proto"
run = """
protoc \
  --go_out=. --go_opt=paths=source_relative \
  --go-grpc_out=. --go-grpc_opt=paths=source_relative \
  proto/token.proto
"""

[tasks."contracts:compile"]
description = "Compile Solidity contracts"
run = "cd contracts && mise run compile"

[tasks."contracts:bindings"]
description = "Generate Go bindings for blockchain-adapter"
run = "cd contracts && mise run bindings"

