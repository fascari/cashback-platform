[tools]
go = "1.25"

[env]
GOFLAGS = "-mod=mod"

[tasks.up]
description = "Start all infrastructure services"
run = "docker-compose up -d"

[tasks.down]
description = "Stop all infrastructure services"
run = "docker-compose down"

[tasks."db:setup"]
description = "Apply schema to all databases (run after 'mise run up')"
run = """
until docker-compose exec -T postgres pg_isready -U cashback; do
  echo "Waiting for PostgreSQL..."
  sleep 2
done
docker-compose exec -T postgres psql -U cashback -d cashback_service_db -f /schema.sql
docker-compose exec -T postgres psql -U cashback -d mint_consumer_db -f /schema.sql
docker-compose exec -T postgres psql -U cashback -d blockchain_adapter_db -f /schema.sql
"""

[tasks."db:reset"]
description = "Reset all databases (drops and recreates)"
run = """
docker-compose down -v
docker-compose up -d postgres
until docker-compose exec -T postgres pg_isready -U cashback; do
  sleep 2
done
echo "Databases reset."
"""

[tasks.deps]
description = "Tidy all modules"
run = [
  "cd services/cashback-service-api && go mod tidy",
  "cd services/mint-consumer && go mod tidy",
  "cd services/blockchain-adapter && go mod tidy",
]

[tasks."run:api"]
description = "Run cashback-service-api"
run = "cd services/cashback-service-api && go run ./cmd/api/main.go"

[tasks."run:adapter"]
description = "Run blockchain-adapter"
run = "cd services/blockchain-adapter && go run ./cmd/main.go"

[tasks."run:consumer"]
description = "Run mint-consumer"
run = "cd services/mint-consumer && go run ./cmd/main.go"

[tasks."test:api"]
description = "Test cashback-service-api"
run = "cd services/cashback-service-api && go test -v -race -coverprofile=coverage.out ./..."

[tasks."test:adapter"]
description = "Test blockchain-adapter"
run = "cd services/blockchain-adapter && go test -v -race -coverprofile=coverage.out ./..."

[tasks."test:consumer"]
description = "Test mint-consumer"
run = "cd services/mint-consumer && go test -v -race -coverprofile=coverage.out ./..."

[tasks.test]
description = "Test all modules"
run = [
  "cd services/cashback-service-api && go test -v -race -coverprofile=coverage.out ./...",
  "cd services/mint-consumer && go test -v -race -coverprofile=coverage.out ./...",
  "cd services/blockchain-adapter && go test -v -race -coverprofile=coverage.out ./...",
]

[tasks.lint]
description = "Lint all modules"
run = [
  "cd services/cashback-service-api && golangci-lint run",
  "cd services/mint-consumer && golangci-lint run",
  "cd services/blockchain-adapter && golangci-lint run",
]

[tasks.proto]
description = "Generate Go code from proto/token.proto"
run = """
protoc \
  --go_out=. --go_opt=paths=source_relative \
  --go-grpc_out=. --go-grpc_opt=paths=source_relative \
  proto/token.proto
"""

[tasks."contracts:compile"]
description = "Compile Solidity contracts"
run = "cd contracts && mise run compile"

[tasks."contracts:bindings"]
description = "Generate Go bindings for blockchain-adapter"
run = "cd contracts && mise run bindings"

