[tools]
go = "1.26"
node = "22"

[tasks.run]
run = "go run ./cmd/main.go"

[tasks.unit]
run = "go test -v -race -coverprofile=coverage.out ./..."

[tasks."test:integration"]
description = "Run integration tests (requires Docker)"
run = "GOWORK=off go test -v -race -tags=integration ./..."

[tasks.test]
description = "Run unit and integration tests"
depends = ["unit", "test:integration"]

[tasks.lint]
run = "golangci-lint run"

[tasks."contracts:bindings"]
description = "Generate Go bindings from CashbackToken ABI"
run = """
abigen \
  --abi ../../contracts/artifacts/contracts/CashbackToken.sol/CashbackToken.json \
  --bin ../../contracts/artifacts/contracts/CashbackToken.sol/CashbackToken.bin \
  --pkg contracts \
  --out internal/contracts/cashbacktoken.go
"""

[tasks."db:migrate"]
description = "Apply pending migrations for blockchain-adapter"
run = "${MISE_PROJECT_ROOT}/../../scripts/migrate.sh blockchain-adapter up"

[tasks."db:rollback"]
description = "Roll back last migration for blockchain-adapter"
run = "${MISE_PROJECT_ROOT}/../../scripts/migrate.sh blockchain-adapter down 1"

[tasks."db:version"]
description = "Show current migration version for blockchain-adapter"
run = "${MISE_PROJECT_ROOT}/../../scripts/migrate.sh blockchain-adapter version"

[tasks."test:integration"]
description = "Run integration tests (requires Docker)"
run = "GOWORK=off go test -v -race -tags=integration ./..."
