name: cashback-platform-e2e

services:
  postgres-e2e:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cashback_app
      POSTGRES_PASSWORD: cashback_app
      POSTGRES_DB: postgres
    ports:
      - "25432:5432"
    volumes:
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init.sh:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashback_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats-e2e:
    image: nats:2.10-alpine
    command: ["-js", "-c", "/etc/nats/nats.conf"]
    ports:
      - "4322:4222"
      - "8322:8222"
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-e2e:
    image: redis:7-alpine
    ports:
      - "6479:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  anvil-e2e:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--port", "8545"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://localhost:8545 2>/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 15
